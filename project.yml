name: Winchester
options:
  bundleIdPrefix: io.github.glandais
  # L'anglais est la langue source du catalogue, pas la langue du code : les
  # clés sont des noms pointés (`pass.report.title`), et le français est une
  # traduction comme une autre. Voir la section « Traduction » de CLAUDE.md.
  developmentLanguage: en
  knownRegions:
    - en
    - fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: "7Q49262697"
    # Le seul endroit où se monte une version : `info.properties` les reprend
    # par $(...). Sans ces deux lignes XcodeGen écrit ses propres valeurs
    # (1.0 / 1) et le numéro de build ignore silencieusement project.yml.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  DiskCore:
    path: .

targets:
  Winchester:
    type: application
    platform: iOS
    dependencies:
      - package: DiskCore
        product: DiskCore
    sources:
      # Le noyau est compilé comme paquet, pas comme fichiers de l'application :
      # il se teste en ligne de commande et compile en concurrence stricte.
      - path: Sources
        excludes:
          - DiskCore/**
    # Une passe dure jusqu'à sept heures : elle doit continuer de sonner écran
    # verrouillé. Le reste de l'Info.plist est généré par Xcode.
    info:
      path: Support/Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.winchester
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Winchester
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Fait écrire un .stringsdata par tranche d'architecture, d'où
        # `./scripts/xcb.sh strings` tire les clés nouvelles du catalogue.
        SWIFT_EMIT_LOC_STRINGS: "YES"
