name: Winchester
options:
  bundleIdPrefix: io.github.glandais
  # L'anglais est la langue source du catalogue, pas la langue du code : les
  # clés sont des noms pointés (`pass.report.title`), et le français est une
  # traduction comme une autre. Voir la section « Traduction » de CLAUDE.md.
  developmentLanguage: en
  knownRegions:
    - en
    - fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# `Screenshots` est un clone de Debug qui ne s'en distingue que par la
# condition SCREENSHOTS : le mode capture (`Sources/Screenshots/`) et ses
# points d'accroche vivent sous `#if SCREENSHOTS`, si bien que rien n'en entre
# dans le binaire archivé. Debug et Release doivent être nommés aussi — déclarer
# `configs` remplace la paire implicite d'XcodeGen.
configs:
  Debug: debug
  Screenshots: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: "7Q49262697"
    # Le seul endroit où se monte une version : `info.properties` les reprend
    # par $(...). Sans ces deux lignes XcodeGen écrit ses propres valeurs
    # (1.0 / 1) et le numéro de build ignore silencieusement project.yml.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Screenshots:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SCREENSHOTS"

packages:
  DiskCore:
    path: .

targets:
  Winchester:
    type: application
    platform: iOS
    dependencies:
      - package: DiskCore
        product: DiskCore
    sources:
      # Le noyau est compilé comme paquet, pas comme fichiers de l'application :
      # il se teste en ligne de commande et compile en concurrence stricte.
      - path: Sources
        excludes:
          - DiskCore/**
    # Une passe dure jusqu'à sept heures : elle doit continuer de sonner écran
    # verrouillé. Le reste de l'Info.plist est généré par Xcode.
    info:
      path: Support/Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.glandais.winchester
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Winchester
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Le multitâche de l'iPad exige les quatre orientations : sans le
        # portrait inversé, App Store Connect refuse l'envoi (erreur 90474).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Fait écrire un .stringsdata par tranche d'architecture, d'où
        # `./scripts/xcb.sh strings` tire les clés nouvelles du catalogue.
        SWIFT_EMIT_LOC_STRINGS: "YES"

schemes:
  Winchester:
    build:
      targets:
        Winchester: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Pour `scripts/screenshots.sh` seulement ; ne jamais archiver avec celui-ci.
  Winchester-Screenshots:
    build:
      targets:
        Winchester: [run, build]
    run:
      config: Screenshots
    profile:
      config: Screenshots
    analyze:
      config: Screenshots
    archive:
      config: Screenshots
