name: DiskNoise
options:
  bundleIdPrefix: fr.glandais
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    DEVELOPMENT_TEAM: "7Q49262697"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  DiskCore:
    path: .

targets:
  DiskNoise:
    type: application
    platform: iOS
    dependencies:
      - package: DiskCore
        product: DiskCore
    sources:
      # Le noyau est compilé comme paquet, pas comme fichiers de l'application :
      # il se teste en ligne de commande et compile en concurrence stricte.
      - path: Sources
        excludes:
          - DiskCore/**
    # Une passe dure jusqu'à sept heures : elle doit continuer de sonner écran
    # verrouillé. Le reste de l'Info.plist est généré par Xcode.
    info:
      path: Support/Info.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.glandais.disknoise
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: DiskNoise
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
